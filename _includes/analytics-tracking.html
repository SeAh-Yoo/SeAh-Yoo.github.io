{% assign goatcounter_code = site.data.analytics.goatcounterCode %}

<script data-goatcounter="https://{{ goatcounter_code | escape }}.goatcounter.com/count"{% if page.analytics_path %} data-goatcounter-settings='{"path": {{ page.analytics_path | relative_url | jsonify }}}'{% endif %} async src="https://gc.zgo.at/count.js"></script>
{% endif %}
