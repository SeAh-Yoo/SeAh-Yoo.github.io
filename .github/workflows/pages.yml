name: Deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install jekyll -v 3.10.0 --no-document
      - run: gem install kramdown-parser-gfm -v 1.1.0 --no-document
      - uses: actions/configure-pages@v5
      - run: ruby scripts/test-extended-headings.rb
      - run: ruby scripts/test-wiki-sections.rb
      - run: ruby scripts/test-wiki-organizations.rb
      - run: ruby scripts/test-wiki-citizens.rb
      - run: ruby -c scripts/validate-wiki-roster.rb
      - run: jekyll _3.10.0_ build
        env:
          JEKYLL_ENV: production
      - run: python scripts/test-wiki.py && python scripts/test-wiki-authoring.py && python scripts/test-wiki-sections.py
        env:
          JEKYLL_VERSION: '3.10.0'
      - run: node --test scripts/wiki-autolinks.test.cjs scripts/wiki-markdown.test.cjs scripts/navigation.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
