            editorial_method: 特にネット配信のガイドや道しるべになる記事を準備し、連載しています。<br />できるだけ事実と根拠に基づく記事を書くよう努めています。
            preservation_note: ブログは「果てしなく続く下水道」をもとにした「異常空間」がコンセプトです。
