      role: "블로그 관리 및 작성"
      introduction: "2000년 10월 10일생, 천칭자리, 키 170.8cm, 체중 인생 최저치 49kg, 최고치 비밀."
      site_description: "문하수도를 꾸미고 관리하고 이상 기록을 분류하고 작성하는 사람.<br />&nbsp;<br />온갖 서브컬쳐에 관심은 물론 조예가 있지만 그 지식이나 능력이 최고 수준에는 이르지 못하는 편.<br />뭐든 연구하고 깊히 파는 것을 좋아하지만 어느 정도 수준에 이르면 다른 것으로 흥미를 돌리는 편."
