            site_description: 文学下水道を飾り、管理し、異常記録を分類して書く人。<br />&nbsp;<br />あらゆるサブカルチャーに興味があり、それなりに詳しいものの、知識も能力も最高水準には届かないほう。<br />何でも調べて深掘りするのが好きだが、ある程度まで進むと別のことに興味を移しがち。
