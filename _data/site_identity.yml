        intro: Meet the person who maintains the Literary Underground.
        description: The Literary Underground’s development and writing, subject choices, editorial principles, and anonymous visitor counts.
        sections:
          profile:
            eyebrow: THE KEEPER
            title: Keeper of the Literary Underground
            name: AhRan Myo
            alternate_name: 묘아란
            role: Blog maintenance and writing
            introduction: 'Born October 10, 2000. Libra. 170.8 cm tall. Lowest-ever weight: 49 kg. Highest: a secret.'
            site_description: The person who decorates and maintains the Literary Underground, sorting and writing its strange records.<br />&nbsp;<br />Interested
              in all sorts of subcultures and reasonably knowledgeable, though neither that knowledge nor those abilities are quite top-tier.<br />Likes researching
              and digging into things, but tends to move on to another interest after reaching a certain level.
            separator: ·
            image_alt: Profile image of AhRan Myo, keeper of the Literary Underground
          editorial:
            eyebrow: NOTES ON KEEPING
            title: Subjects and concept
            editorial_purpose: Small thoughts on AI, games, manga/anime, film, livestreaming, online communities, subculture, and more.
            editorial_method: In particular, I prepare and publish guides to livestreaming.<br />I try to base posts on facts and evidence whenever possible.
            preservation_note: The blog is built around an uncanny space based on an endlessly extending sewer.
            image_alt: Records, a game controller, and film reels in a violet-lit sewer workspace
          navigation:
            eyebrow: WAYS THROUGH
            title: How to read the strange records
            intro: On your first visit, choose a subject that interests you at the information desk.
            start_suffix: ' is the place to start.'
            paths_prefix: 'You can also find strange records using search or these menus:'
            series_label: Series
            image_alt: A map and compass at a junction of three sewer passages
          participation:
            eyebrow: OPEN DOOR
            title: Using and contributing to the Literary Underground
            description: Unless otherwise noted, all writing, images, and design on this blog are CC0 1.0.<br />Sign in with your GitHub account to share comments
              and additions below each post.<br />You can also receive new posts through the RSS feed.
            image_alt: A noticeboard and open archive waiting for visitors’ notes
          privacy:
            eyebrow: VISITOR TRACES
            title: About visitor records
            description: The Literary Underground uses GoatCounter to count anonymous visits and post-reading activity.<br />This website does not create cookies
              or permanent identifiers for analytics.<br />&nbsp;<br />Visit and reading counts are approximate figures used to help maintain the blog, rather than
              exact measurements.
            opt_out_prefix: If you prefer, choose
            opt_out_label: exclude this browser from statistics
            opt_out_suffix: . Details are available in
            privacy_label: GoatCounter's privacy guide
            privacy_suffix: .
            image_alt: Fading footprints beside the water in an empty sewer
        notes:
          enabled: true
          items:
            - title: Warnings
              body: Food or drinks may sometimes be provided in certain spaces in the sewer.<br />Under no circumstances should you consume them.
            - title: Keeper’s note
              body: I cannot tell how visitors find their way into this place.<br />Any manhole on the surface could connect to the Literary Underground.
