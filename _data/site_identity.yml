            description: 文学下水道はGoatCounterで匿名の訪問の流れと記事の閲覧状況を集計します。<br />このウェブサイトは統計のためのCookieや永続的な識別子を作成しません。<br />&nbsp;<br />訪問・閲覧数は厳密な実数ではなく、ブログ管理の参考にするためのおおよその数値です。
