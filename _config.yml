url: "https://seah-yoo.github.io"
baseurl: ""
lang: "ko-KR"
timezone: "Asia/Seoul"

permalink: /posts/:slug/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true

collections:
  wiki:
    output: true
    permalink: /wiki/:name/

defaults:
  - scope:
      path: ""
      type: wiki
    values:
      layout: wiki
      lang: ko
  - scope:
      path: "google27564fde5057ccbe.html"
    values:
      sitemap: false

# Development checks are not published as site assets.
exclude:
  - scripts/test-wiki.py
  - scripts/test-wiki-authoring.py
  - scripts/wiki-autolinks.test.cjs
  - scripts/__pycache__
